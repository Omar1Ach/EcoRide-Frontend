name: ecoride
description: EcoRide - Eco-friendly Ride Sharing Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Network
  dio: ^5.7.0
  retrofit: ^4.4.1
  pretty_dio_logger: ^1.4.0

  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # QR Code
  # qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  # Permissions
  permission_handler: ^11.3.1

  # Image
  image_picker: ^1.1.2
  flutter_animate: ^4.5.2
  flutter_vibrate: ^1.3.0
  easy_localization: ^3.0.7

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  retrofit_generator: ^9.1.2

flutter:
  uses-material-design: true

  # Assets will be added later when needed
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/

  # Using Google Fonts package instead of local fonts
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
