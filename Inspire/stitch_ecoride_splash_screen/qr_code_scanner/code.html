<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QR Code Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
    .scanner-line {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(to right, transparent, #13ec5b, transparent);
        box-shadow: 0 0 10px #13ec5b, 0 0 20px #13ec5b;
        animation: scan 3s linear infinite;
        opacity: 0;
        animation-delay: 0.5s;
    }

    @keyframes scan {
        0% {
            top: 0;
            opacity: 1;
        }
        100% {
            top: 100%;
            opacity: 1;
        }
    }
  </style>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13ec5b",
            "background-light": "#f6f8f6",
            "background-dark": "#102216",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Camera View Background -->
<div class="absolute inset-0 h-full w-full bg-black">
<img class="h-full w-full object-cover" data-alt="A blurry, first-person view of a city street at night, suitable for a camera background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZZYAtijvnzG2Uypkl8qSQrUDJxEa4mEs2eBeR-8FqCzs2LdzOLJsvvOJGy2QvXG8fgzh0zVZbIM_wLfg80RcWIuDjCAWUJsaHUtj9NDjT-Yr9JkgJvlyZ_hRLRq-aEz1OpZIGY7BbnIXUy4uKunQqZ2093YYp9SPD-XH67rR_NgwnQlLdJ_Bn2wMIHskBQX-r6XH8PENcTE9aJivxqPenhKQAW3Lm5-VWEzpLICG7Rb0CPd853b3mlfq8MaPEZh50QrIDyTGGOZ-3"/>
<div class="absolute inset-0 bg-black/30"></div>
</div>
<!-- Main UI -->
<div class="relative z-10 flex h-full flex-col justify-between">
<!-- TopAppBar -->
<header class="flex items-center justify-between p-4 pt-6 bg-gradient-to-b from-black/50 to-transparent">
<button class="flex size-12 items-center justify-center rounded-full bg-black/30 backdrop-blur-sm">
<span class="material-symbols-outlined text-white text-2xl">close</span>
</button>
<button class="flex size-12 items-center justify-center rounded-full bg-black/30 backdrop-blur-sm">
<span class="material-symbols-outlined text-white text-2xl">flashlight_on</span>
</button>
</header>
<!-- Scanner Area -->
<main class="flex flex-1 flex-col items-center justify-center p-4">
<div class="relative aspect-square w-full max-w-[280px]">
<!-- Corner brackets -->
<div class="absolute -top-1 -left-1 h-12 w-12 border-l-4 border-t-4 border-white/90 rounded-tl-xl"></div>
<div class="absolute -top-1 -right-1 h-12 w-12 border-r-4 border-t-4 border-white/90 rounded-tr-xl"></div>
<div class="absolute -bottom-1 -left-1 h-12 w-12 border-l-4 border-b-4 border-white/90 rounded-bl-xl"></div>
<div class="absolute -bottom-1 -right-1 h-12 w-12 border-r-4 border-b-4 border-white/90 rounded-br-xl"></div>
<!-- Scanning Line -->
<div class="scanner-line"></div>
</div>
</main>
<!-- Bottom Overlay -->
<footer class="flex flex-col items-center gap-4 p-4 pb-8 bg-gradient-to-t from-black/50 to-transparent">
<p class="text-base font-normal leading-normal text-white text-center">Align QR code within the frame</p>
<button>
<p class="text-sm font-normal leading-normal text-white underline">Enter code manually</p>
</button>
</footer>
</div>
<!-- Bottom Sheet Modal (Initially hidden, shown by interaction) -->
<div class="absolute inset-0 z-20 flex flex-col justify-end bg-black/60 backdrop-blur-sm">
<div class="flex flex-col items-stretch rounded-t-2xl bg-background-dark">
<!-- BottomSheetHandle -->
<div class="flex h-5 w-full items-center justify-center pt-3">
<div class="h-1 w-9 rounded-full bg-[#3b5443]"></div>
</div>
<!-- TitleText -->
<h1 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 text-left pb-3 pt-5">Enter Code</h1>
<!-- Input Field -->
<div class="px-4 py-2">
<input class="w-full rounded-lg border-2 border-white/20 bg-white/10 p-4 text-white placeholder-white/50 focus:border-primary focus:ring-primary font-display" placeholder="e.g., ECR-12345" type="text"/>
</div>
<!-- Action Button -->
<div class="p-4 pt-6 pb-8">
<button class="w-full rounded-lg bg-primary py-4 text-center text-base font-bold text-background-dark">Unlock Ride</button>
</div>
</div>
</div>
</div>
</body></html>
