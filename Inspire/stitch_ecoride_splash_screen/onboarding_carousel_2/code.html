<footer class="flex flex-col items-center space-y-6 pb-4">
<div class="flex space-x-2" id="pagination">
<div class="w-2.5 h-2.5 bg-primary rounded-full"></div>
<div class="w-2.5 h-2.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
<div class="w-2.5 h-2.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
<button class="w-full bg-primary text-white font-semibold py-4 rounded-full shadow-lg shadow-primary/20 hover:bg-lime-500 transition-colors duration-300">
                Get Started
            </button>
</footer>
</div>
<script>
        const carousel = document.getElementById('carousel');
        const paginationDots = document.querySelectorAll('#pagination > div');
        const updatePagination = () => {
            const scrollLeft = carousel.scrollLeft;
            const slideWidth = carousel.clientWidth;
            const activeIndex = Math.round(scrollLeft / slideWidth);
            paginationDots.forEach((dot, index) => {
                if (index === activeIndex) {
                    dot.classList.add('bg-primary');
                    dot.classList.remove('bg-slate-300', 'dark:bg-slate-700');
                } else {
                    dot.classList.remove('bg-primary');
                    dot.classList.add('bg-slate-300', 'dark:bg-slate-700');
                }
            });
        };
        let debounceTimer;
        carousel.addEventListener('scroll', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePagination, 50);
        });
        // Initial call
        updatePagination();
    </script>
