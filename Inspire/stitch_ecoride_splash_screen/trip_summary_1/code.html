<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trip Summary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4E8D7C",
            "background-light": "#FDFDFD",
            "background-dark": "#102216",
          },
          fontFamily: {
            "display": ["Space Grotesk"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col font-display group/design-root overflow-x-hidden">
<div class="relative flex w-full flex-col items-center justify-center overflow-hidden bg-[#D8B4A0]/20 dark:bg-[#D8B4A0]/10 pt-16 pb-8">
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#D8B4A0]/30 to-transparent"></div>
<div class="z-10 flex h-28 w-28 items-center justify-center rounded-full bg-primary text-background-light">
<span class="material-symbols-outlined !text-7xl" data-icon="check_circle">check_circle</span>
</div>
</div>
<h1 class="text-[#333333] dark:text-white tracking-light text-[32px] font-bold leading-tight px-4 text-center pb-2 pt-6">Trip completed!</h1>
<p class="text-[#A9A9A9] dark:text-[#A9A9A9] text-base font-normal leading-normal pb-6 px-4 text-center">Thanks for riding green!</p>
<div class="px-4 @container pb-6">
<div class="flex flex-col items-stretch justify-start rounded-xl bg-background-light dark:bg-[#1C2C22] shadow-[0_4px_12px_rgba(0,0,0,0.05)] dark:shadow-[0_4px_16px_rgba(0,0,0,0.2)]">
<div class="relative w-full rounded-t-xl overflow-hidden aspect-[16/9] bg-gray-200 dark:bg-zinc-800">
<img alt="A map showing the completed trip route" class="absolute inset-0 h-full w-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZ_8AtoH8gYUvithW0q6Ot5EGKsAlOKjaP8Alfx7CqV1-zKG9NUmFzjpP0B8WF7GcU7IKLabisTFkRcF4N7DX5wXzpOWDXj2I-15fhf3LYYZ4Pt8EOJjjulrODkAlais-hgauK1mbuqEZ-ZapckwAYwslxzxMUc_Vq2gua5gNgX6rCWs1_7K3mhS09ruGYiugHBTuUg5qC21YDHjgiZT1ylr2dXt4VmrtlAeaFAGva8JZa4ZPbhbZMItoMfoDTgnagL3PxIY2w1a4S"/>
<div class="absolute top-4 right-4 flex gap-2">
<button class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm text-zinc-800 dark:text-zinc-200 shadow-md">
<span class="material-symbols-outlined text-xl">replay</span>
</button>
<button class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm text-zinc-800 dark:text-zinc-200 shadow-md">
<span class="material-symbols-outlined text-xl">open_in_full</span>
</button>
</div>
</div>
<div class="flex w-full grow flex-col items-stretch justify-center gap-5 p-5">
<div class="flex flex-col gap-3">
<div class="flex items-baseline justify-between">
<span class="text-sm text-[#A9A9A9]">Unlock fee</span>
<span class="tabular-nums font-mono text-sm text-[#333333] dark:text-white">1.00 MAD</span>
</div>
<div class="flex items-baseline justify-between">
<span class="text-sm text-[#A9A9A9]">15.2 min at 0.50/min</span>
<span class="tabular-nums font-mono text-sm text-[#333333] dark:text-white">7.60 MAD</span>
</div>
<hr class="border-t border-gray-200 dark:border-zinc-700/50"/>
<div class="flex items-baseline justify-between">
<span class="font-bold text-[#333333] dark:text-white">Total</span>
<span class="tabular-nums font-mono font-bold text-[#333333] dark:text-white">8.60 MAD</span>
</div>
</div>
<div class="grid grid-cols-2 gap-x-4 gap-y-5 rounded-lg border border-gray-200 dark:border-zinc-700/50 p-4">
<div class="flex flex-col items-start gap-1">
<span class="text-xs text-[#A9A9A9]">Duration</span>
<span class="text-base font-bold text-[#333333] dark:text-white">15 min</span>
</div>
<div class="flex flex-col items-start gap-1">
<span class="text-xs text-[#A9A9A9]">Distance</span>
<span class="text-base font-bold text-[#333333] dark:text-white">2.5 km</span>
</div>
<div class="flex flex-col items-start gap-1">
<span class="text-xs text-[#A9A9A9]">Avg. Speed</span>
<span class="text-base font-bold text-[#333333] dark:text-white">10 km/h</span>
</div>
<div class="flex flex-col items-start gap-1">
<span class="text-xs text-[#A9A9A9]">CO2 Saved</span>
<span class="text-base font-bold text-[#333333] dark:text-white">1.2 kg</span>
</div>
</div>
<button class="flex items-center justify-between py-2 text-left">
<span class="text-sm font-medium text-primary">View trip specifics</span>
<span class="material-symbols-outlined text-primary text-2xl transition-transform">expand_more</span>
</button>
</div>
</div>
</div>
<div class="flex-grow"></div>
<div class="sticky bottom-0 bg-background-light dark:bg-background-dark pt-2">
<div class="flex px-4 py-4">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 flex-1 bg-primary text-background-light dark:text-background-light text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Rate Trip</span>
</button>
</div>
</div>
</div>

</body></html>
