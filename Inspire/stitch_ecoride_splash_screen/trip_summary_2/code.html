<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trip Summary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4E8D7C",
            "background-light": "#FDFDFD",
            "background-dark": "#102216",
          },
          fontFamily: {
            "display": ["Space Grotesk"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col font-display group/design-root overflow-x-hidden">
<!-- Header Section -->
<div class="relative flex w-full flex-col items-center justify-center overflow-hidden bg-[#D8B4A0]/20 dark:bg-[#D8B4A0]/10 pt-16 pb-8">
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#D8B4A0]/30 to-transparent"></div>
<!-- Lottie Animation Placeholder -->
<div class="z-10 flex h-28 w-28 items-center justify-center rounded-full bg-primary text-background-light">
<span class="material-symbols-outlined !text-7xl" data-icon="check_circle">check_circle</span>
</div>
</div>
<!-- Trip Confirmation Text -->
<h1 class="text-[#333333] dark:text-white tracking-light text-[32px] font-bold leading-tight px-4 text-center pb-2 pt-6">Trip completed!</h1>
<p class="text-[#A9A9A9] dark:text-[#A9A9A9] text-base font-normal leading-normal pb-6 px-4 text-center">Thanks for riding green!</p>
<!-- Trip Details Card -->
<div class="px-4 @container pb-6">
<div class="flex flex-col items-stretch justify-start rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] dark:shadow-[0_4px_12px_rgba(0,0,0,0.2)] bg-background-light dark:bg-zinc-900/50">
<div class="w-full bg-center bg-no-repeat aspect-video bg-cover rounded-t-xl" data-alt="A map showing the route taken from a start point to an end point" data-location="Marrakech" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCZ_8AtoH8gYUvithW0q6Ot5EGKsAlOKjaP8Alfx7CqV1-zKG9NUmFzjpP0B8WF7GcU7IKLabisTFkRcF4N7DX5wXzpOWDXj2I-15fhf3LYYZ4Pt8EOJjjulrODkAlais-hgauK1mbuqEZ-ZapckwAYwslxzxMUc_Vq2gua5gNgX6rCWs1_7K3mhS09ruGYiugHBTuUg5qC21YDHjgiZT1ylr2dXt4VmrtlAeaFAGva8JZa4ZPbhbZMItoMfoDTgnagL3PxIY2w1a4S");'></div>
<div class="flex w-full grow flex-col items-stretch justify-center gap-4 p-5">
<!-- Key Metrics Row -->
<div class="flex items-center justify-around gap-4 text-center">
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="route">route</span>
<span class="text-sm font-bold text-[#333333] dark:text-white">2.5 km</span>
<span class="text-xs text-[#A9A9A9]">Distance</span>
</div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="schedule">schedule</span>
<span class="text-sm font-bold text-[#333333] dark:text-white">15 min</span>
<span class="text-xs text-[#A9A9A9]">Duration</span>
</div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="eco">eco</span>
<span class="text-sm font-bold text-[#333333] dark:text-white">1.2 kg</span>
<span class="text-xs text-[#A9A9A9]">CO2 Saved</span>
</div>
</div>
<!-- Divider -->
<hr class="border-t border-gray-200 dark:border-zinc-800"/>
<!-- Cost & Payment Section -->
<div class="flex items-center justify-between">
<span class="text-base font-normal text-[#333333] dark:text-white">Total Fare</span>
<div class="flex items-center gap-2">
<span class="text-base font-bold text-[#333333] dark:text-white">$5.80</span>
<span class="material-symbols-outlined text-[#A9A9A9] text-xl" data-icon="credit_card">credit_card</span>
<span class="text-sm text-[#A9A9A9]">•••• 1234</span>
</div>
</div>
</div>
</div>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-grow"></div>
<!-- Primary CTA -->
<div class="flex px-4 py-6">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 flex-1 bg-primary text-background-light dark:text-background-light text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Done</span>
</button>
</div>
</div>
</body></html>
