<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Methods Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2A9D8F",
                        "background-light": "#F9F9F9",
                        "background-dark": "#264653",
                        "text-light-primary": "#264653",
                        "text-dark-primary": "#FFFFFF",
                        "text-light-secondary": "#8A8A8E",
                        "text-dark-secondary": "#A8B4B9",
                        "destructive": "#E76F51",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 flex items-center bg-background-light/80 dark:bg-background-dark/80 p-4 pb-3 backdrop-blur-sm">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full text-text-light-primary dark:text-text-dark-primary">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="text-text-light-primary dark:text-text-dark-primary flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em] pr-10">Payment Methods</h1>
</div>
<main class="flex flex-1 flex-col px-4 pt-4 pb-6">
<!-- List Header -->
<h2 class="mb-2 px-2 text-sm font-semibold uppercase tracking-wider text-text-light-secondary dark:text-text-dark-secondary">Saved Cards &amp; Accounts</h2>
<!-- Payment Method List -->
<div class="flex flex-col gap-3">
<!-- List Item 1: Mastercard (Default) -->
<div class="flex items-center gap-4 rounded-lg bg-white dark:bg-white/10 p-4 shadow-sm shadow-black/[0.02] dark:shadow-none">
<div class="bg-center bg-no-repeat aspect-video bg-contain h-6 w-10 shrink-0" data-alt="Mastercard logo" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB0NFX6N6d7DgRN5GT3YQQLADokXC-hdSlTtLfATg84dbfLaRmQ0ggfqsQ4ANZHYTb6judRBt2ZbK3lX0tfZBsAXGkFSb_FOIkM2nGJQeHBwuiqd5vx9zFBUDrTLrmSlo0k5KeO-2cBT8n757-YQm_IENJSP4xi8TwFiq4ze0u2OwptGoxDKw2oNyGZHqIWfBQ71oQxsyYGGHi90kL8Jp9YwhNzJZyzuMIDluJ11k6FlNOHkZTRPOAPE3yQR7vlqBX0YxrPPNUcIRkj");'></div>
<div class="flex flex-1 flex-col justify-center">
<div class="flex items-center gap-2">
<p class="text-text-light-primary dark:text-text-dark-primary text-base font-medium leading-normal line-clamp-1">Mastercard •••• 4242</p>
<span class="rounded-full bg-primary/20 px-2 py-0.5 text-xs font-semibold text-primary">Default</span>
</div>
<p class="text-text-light-secondary dark:text-text-dark-secondary text-sm font-normal leading-normal line-clamp-2">Expires 12/26</p>
</div>
<div class="shrink-0">
<button class="flex size-8 items-center justify-center rounded-full text-text-light-secondary dark:text-text-dark-secondary hover:bg-gray-100 dark:hover:bg-white/10">
<span class="material-symbols-outlined text-xl">more_vert</span>
</button>
</div>
</div>
<!-- List Item 2: Visa -->
<div class="flex items-center gap-4 rounded-lg bg-white dark:bg-white/10 p-4 shadow-sm shadow-black/[0.02] dark:shadow-none">
<div class="bg-center bg-no-repeat aspect-video bg-contain h-6 w-10 shrink-0" data-alt="Visa logo" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuC_WfReydlfZBKcGOZ9ySO--QZsBfPWvRliELpzcnKvFHxf4uq6kpSbLs31VQgBzxfC20_szrJH1AmfHBjam4-yfYL1SI4CP2p54yssiw1JOX_53zxwo3AGhg1wrgNwGT56JcNP0HeHDDJSXRRGomqhoUoXDDMZpwmaCJOdBveapga_h1iucu-t-Y0-dxYboL6MQYovgpxvqwQA97v_6BPgCD7DNVIML0ydirdIUQVBR3DU6xv9AavpOkqtezGU5doYVrscarpYpQe_");'></div>
<div class="flex flex-1 flex-col justify-center">
<p class="text-text-light-primary dark:text-text-dark-primary text-base font-medium leading-normal line-clamp-1">Visa •••• 8890</p>
<p class="text-text-light-secondary dark:text-text-dark-secondary text-sm font-normal leading-normal line-clamp-2">Expires 08/25</p>
</div>
<div class="shrink-0">
<button class="flex size-8 items-center justify-center rounded-full text-text-light-secondary dark:text-text-dark-secondary hover:bg-gray-100 dark:hover:bg-white/10">
<span class="material-symbols-outlined text-xl">more_vert</span>
</button>
</div>
</div>
<!-- List Item 3: Apple Pay -->
<div class="flex items-center gap-4 rounded-lg bg-white dark:bg-white/10 p-4 shadow-sm shadow-black/[0.02] dark:shadow-none">
<div class="bg-center bg-no-repeat aspect-video bg-contain h-6 w-10 shrink-0" data-alt="Apple Pay logo" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCfbUroGBeSihNCFN85OmcaYWPqvr89Pq7win2kxUJCrlZ4iZYm4y3XfutI0fAkgi0bBg97BNeJrq3mpP_Tfho6u17lwP0TCvwaM4tMPJ7d0NPhv8HPdCP2-v2yR9xGe50oFrcoex1Bw787158DJuodi7NPbSmEga6LyMDw8bi-4cD3lrY5U9rOqU6eJnaLznDErkN0aXZGA0qbEexyDM9PHpnGICJKg7cPyqD9UQ4zdl4oTZVZhnW0FvIuTCWeHJav0X3fYGtJNYjW");'></div>
<p class="text-text-light-primary dark:text-text-dark-primary text-base font-medium leading-normal flex-1 truncate">Apple Pay</p>
<div class="shrink-0">
<button class="flex size-8 items-center justify-center rounded-full text-text-light-secondary dark:text-text-dark-secondary hover:bg-gray-100 dark:hover:bg-white/10">
<span class="material-symbols-outlined text-xl">more_vert</span>
</button>
</div>
</div>
</div>
<div class="flex-grow"></div> <!-- Spacer to push CTA to bottom -->
<!-- Security Message -->
<p class="flex items-center justify-center gap-2 text-text-light-secondary dark:text-text-dark-secondary text-xs font-normal leading-normal py-4 text-center">
<span class="material-symbols-outlined text-base">verified_user</span>
                Your payment info is securely stored.
            </p>
<!-- CTA Button -->
<button class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary py-4 text-center text-base font-bold text-white transition-opacity hover:opacity-90">
<span class="material-symbols-outlined">add_card</span>
<span>Add New Payment Method</span>
</button>
</main>
</div>
</body></html>
