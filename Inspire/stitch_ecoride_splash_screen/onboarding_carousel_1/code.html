<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Expiry Date Picker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        @layer utilities {
          .scrollbar-hide::-webkit-scrollbar {
            display: none;
          }
          .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
          }
        }
    </style>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#65a30d",
              "surface-light": "#fef7ff",
              "surface-dark": "#1d1b20",
              "on-surface-light": "#1d1b20",
              "on-surface-dark": "#e6e1e5",
              "on-surface-variant-light": "#49454f",
              "on-surface-variant-dark": "#cac4d0",
              "outline-light": "#79747e",
              "outline-dark": "#938f99",
              "scrim": "rgba(0, 0, 0, 0.4)",
            },
            fontFamily: {
              display: ["Poppins", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              'extra-large': '1.75rem',
            },
          },
        },
      };
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative min-h-screen w-screen bg-white dark:bg-slate-900 overflow-hidden" id="app-container">
<div class="p-6">
<h1 class="text-2xl font-bold text-slate-800 dark:text-slate-200">Add New Card</h1>
<div class="mt-8 space-y-4">
<div class="relative">
<label class="block text-sm font-medium text-slate-500 dark:text-slate-400" for="card-number">Card Number</label>
<input class="mt-1 block w-full rounded-md border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 p-3 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-slate-700 dark:text-slate-300" id="card-number" placeholder="•••• •••• •••• ••••" type="text"/>
</div>
<div class="flex space-x-4">
<div class="w-1/2">
<label class="block text-sm font-medium text-slate-500 dark:text-slate-400" for="expiry-date">Expiry Date</label>
<input class="mt-1 block w-full rounded-md border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 p-3 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-slate-700 dark:text-slate-300" id="expiry-date" placeholder="MM / YY" type="text" value="08 / 25"/>
</div>
<div class="w-1/2">
<label class="block text-sm font-medium text-slate-500 dark:text-slate-400" for="cvv">CVV</label>
<input class="mt-1 block w-full rounded-md border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 p-3 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-slate-700 dark:text-slate-300" id="cvv" placeholder="•••" type="text"/>
</div>
</div>
</div>
</div>
<div class="absolute inset-0 flex flex-col justify-end bg-scrim z-10" id="bottom-sheet">
<div class="w-full bg-surface-light dark:bg-surface-dark rounded-t-extra-large p-6 pt-4 flex flex-col">
<div class="mx-auto w-8 h-1 bg-outline-light dark:bg-outline-dark rounded-full mb-6"></div>
<div class="flex justify-around px-4 mb-2">
<span class="w-1/2 text-center text-sm font-medium text-on-surface-variant-light dark:text-on-surface-variant-dark">Month</span>
<span class="w-1/2 text-center text-sm font-medium text-on-surface-variant-light dark:text-on-surface-variant-dark">Year</span>
</div>
<div class="relative h-48 flex items-center overflow-hidden">
<div class="absolute inset-x-0 h-10 top-1/2 -translate-y-1/2 bg-primary/10 dark:bg-primary/20 rounded-lg border-y border-primary/20 dark:border-primary/30"></div>
<div class="w-1/2 h-full overflow-y-scroll snap-y snap-mandatory scrollbar-hide">
<div class="snap-center h-10"></div> 
<div class="snap-center h-10"></div> 
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">01</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">02</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">03</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">04</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">05</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">06</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">07</div>
<div class="flex items-center justify-center h-10 snap-center text-lg font-semibold text-primary">08</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">09</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">10</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">11</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">12</div>
<div class="snap-center h-10"></div> 
<div class="snap-center h-10"></div> 
</div>
<div class="w-1/2 h-full overflow-y-scroll snap-y snap-mandatory scrollbar-hide">
<div class="snap-center h-10"></div> 
<div class="snap-center h-10"></div> 
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">2024</div>
<div class="flex items-center justify-center h-10 snap-center text-lg font-semibold text-primary">2025</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">2026</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">2027</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">2028</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">2029</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">2030</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">2031</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">2032</div>
<div class="flex items-center justify-center h-10 snap-center text-on-surface-light dark:text-on-surface-dark">2033</div>
<div class="snap-center h-10"></div> 
<div class="snap-center h-10"></div> 
</div>
</div>
<div class="flex justify-end space-x-4 pt-6">
<button class="px-6 py-2.5 text-sm font-semibold text-primary rounded-full hover:bg-primary/10 transition-colors">Cancel</button>
<button class="px-6 py-2.5 text-sm font-semibold text-white bg-primary rounded-full hover:bg-lime-500 transition-colors">Done</button>
</div>
</div>
</div>
</div>

</body></html>
